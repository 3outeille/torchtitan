[job]
dump_folder = "./outputs"
description = "Llama 3 tiny model for CPU testing"
print_config = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "llama3"
flavor = "tinymodel"
hf_assets_path = "./tests/assets/tokenizer_tiny"

[optimizer]
name = "AdamW"
lr = 1e-3              # Slightly higher for small models
eps = 1e-8

[lr_scheduler]
warmup_steps = 10      # More warmup
decay_ratio = 0.8
decay_type = "cosine"  # Smoother decay
min_lr_factor = 0.0

[training]
local_batch_size = 4   # Larger batch for stability
seq_len = 128
max_norm = 1.0
steps = 50            # More steps to see convergence
dataset = "c4_test"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
pipeline_parallel_schedule = "Interleaved1F1B"
context_parallel_degree = 1

[checkpoint]
enable = false
folder = "checkpoint"
interval = 10
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = "none"    # Disable for tiny model

[compile]
enable = false
components = ["model", "loss"]

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

[validation]
enable = false
dataset = "c4_validation"
freq = 5
steps = 10
